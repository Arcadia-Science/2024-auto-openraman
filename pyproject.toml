[build-system]
requires = ["hatchling>=1.21", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Append .dirty when there are uncommitted changes (mirrors poetry-dynamic-versioning dirty=true)
local_scheme = "dirty-tag"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["autoopenraman"]
include = ["autoopenraman/sample_profile.yml"]

[project]
name = "autoopenraman"
dynamic = ["version"]
description = "Automation of OpenRaman"
authors = [{ name = "Ilya Kolb", email = "ilya.kolb.0@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "matplotlib==3.9.2",
    "numpy==1.26.4",
    "click==8.1.7",
    "scipy==1.14.1",
    "pandas==2.2.3",
    "tk==0.1.0",
    "pycromanager==1.0.2",
    "pyyaml==6.0.3",
    "pyqt5==5.15.11",
    # Pin pyqt5-qt5 to 5.15.2 on Windows to avoid installation errors
    "pyqt5-qt5==5.15.17; sys_platform == 'darwin'",
    "pyqt5-qt5==5.15.2; sys_platform == 'win32'",
    "pyqtgraph==0.13.7",
    "arcadia-pycolor==0.6.2",
    "ramanspy==0.2.10",
    "beautifulsoup4==4.13.4",
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
]

[project.urls]
Homepage = "https://github.com/Arcadia-Science/"
Repository = "https://github.com/Arcadia-Science/2024-auto-openraman"
Documentation = "https://github.com/Arcadia-Science/2024-auto-openraman/blob/main/README.md"

[project.scripts]
autoopenraman = "autoopenraman.cli:main"

[project.optional-dependencies]
docs = [
    "sphinx==6.1.0",
    "sphinx-copybutton==0.5.2",
    "furo==2024.5.6",
    "myst-parser==3.0.1",
    "sphinx-autoapi==3.1.2",
    "sphinx-tabs==3.4.5",
    "nbsphinx==0.9.5",
    "jupyterlab==4.2.5",
    "matplotlib==3.9.2",
]

[dependency-groups]
dev = [
    "pre-commit==3.5.0",
    "pyright>=1.1.367",
    "pytest==8.2.1",
    "ruff==0.4.4",
]

[tool.ruff]
# The directories to consider when resolving first- vs. third-party imports.
src = ["."]
line-length = 100
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# Ignore star and unused imports.
"__init__.py" = ["F403", "F405"]

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "W",  # pycodestyle warning
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
order-by-type = true
no-lines-before = ["future", "standard-library"]

[tool.pyright]
typeCheckingMode = "basic"
exclude = ["./.venv", "./dist"]

# Pyright reports a lot of unknown-member errors for some packages.
# If this is a problem, set this to `false`.
reportUnknownMemberType = false
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportAbstractUsage = "warning"
reportGeneralTypeIssues = "warning"
